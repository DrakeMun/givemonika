<!DOCTYPE html>
<html lang="vi">
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: linear-gradient(180deg, #f3e5f5, #ce93d8); /* nền tím nhạt */
    font-family: 'Poppins', sans-serif;
    overflow: hidden;
  }

  h1 {
    color: #6a1b9a; 
    font-size: 2.2em;
    margin-bottom: 20px;
    text-shadow: 2px 2px #ce93d8; 
    text-align: center;
  }

  input {
    padding: 12px 20px;
    border: 2px solid #9c27b0; 
    border-radius: 25px;
    font-size: 1.1em;
    outline: none;
    text-align: center;
    width: 260px;
    transition: 0.3s;
    background-color: #f8f0f8; 
  }

  input:focus {
    border-color: #7b1fa2;
    box-shadow: 0 0 10px #ce93d8;
  }

  button {
    margin-top: 20px;
    padding: 10px 30px;
    background: #9c27b0;
    color: rgb(255, 255, 255);
    font-size: 1.1em;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    transition: 0.3s;
  }

  button:hover {
    background: #ba68c8; 
    transform: scale(1.1);
  }

  footer {
    position: absolute;
    bottom: 20px;
    color: #9c27b0;
    font-size: 0.9em;
  }

  .flower {
    position: fixed;
    top: -10px;
    color: #ce93d8; /* hoa màu tím nhạt */
    animation: fall linear forwards;
    z-index: 999;
    font-size: 22px;
    opacity: 0.8;
  }

  @keyframes fall {
    to {
      transform: translateY(110vh) rotate(360deg);
      opacity: 0;
    }
  }
</style>

<body>
  <h1 style="font-size: 3em;">💖 Hé lu Monika 💖</h1>
  <button onclick="goNext()" style="font-size: 1.5em; padding: 0.5em 1em;">Tiếp tục </button>

  <footer style="font-size: 1.2em;">🌸 Thiệp chúc mừng 20/10 🌸</footer>

  <script>
    function goNext() {
      const name = "Monika"; 
      localStorage.setItem("receiverName", name);
      window.location.href = "intro.html";
    }

    const flowers = ["🌸","🌷","🌺","💮","🌼"];
    setInterval(() => {
      const f = document.createElement("div");
      f.className = "flower";
      f.textContent = flowers[Math.floor(Math.random() * flowers.length)];
      f.style.left = Math.random() * 100 + "vw";
      f.style.animationDuration = 3 + Math.random() * 5 + "s";
      f.style.position = "fixed";   // chắc chắn rơi trên màn hình
      f.style.fontSize = (20 + Math.random() * 20) + "px"; // hoa cũng lớn hơn
      document.body.appendChild(f);
      setTimeout(() => f.remove(), 8000);
    }, 400);
  </script>
</body>

</html>
